version: "3.9"

services:
  almalatina-bot:
    build: .
    image: almalatina-bot:latest
    container_name: almalatina-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change-me-please}
      ADMIN_CHAT_IDS: ${ADMIN_CHAT_IDS:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PORT: 8080
      DB_PATH: /data/almalatina.db
    volumes:
      - almalatina-data:/data

volumes:
  almalatina-data:
